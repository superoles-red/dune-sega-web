<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="robots" content="noindex"><title>Dune - The Battle for Arrakis</title>
<style>
*{box-sizing:border-box}html{background:#000;color:#fff;font:16px/1.6 monospace}body{margin:0;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:grid;place-items:center}main{width:min(100%,420px);text-align:center}img{width:min(288px,80%);height:auto;image-rendering:pixelated}h1{font-size:20px;margin:24px 0;min-height:1.6em}progress{width:100%;height:12px;accent-color:#00b600}button{font:inherit;min-height:56px;padding:12px 20px;display:block;width:100%;border:3px outset #ddd;background:#9393b6;color:#000;cursor:pointer;margin:20px 0 0;touch-action:manipulation}button:active{border-style:inset}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}
</style></head><body><main>
<img src="./ui-assets/screen-assets/art/title-logo.png" width="192" height="56" alt="Dune — The Battle for Arrakis">
<h1 id="status" role="status" aria-live="polite">UPDATING…</h1>
<progress id="progress" aria-label="Download progress"></progress>
<button id="restart" hidden>RESTART GAME</button>
</main><script type="module">
import {OfflineUpdater} from './update-game.mjs?v=20261106-target1';
const automatic=new URL(location.href).searchParams.get('auto')==='1';
let ru=false;try{ru=localStorage.getItem('dune-sega-language-v1')==='ru';}catch{}
const words=ru?{updating:'ОБНОВЛЕНИЕ…',ready:'ОБНОВЛЕНИЕ ГОТОВО',applying:'ПЕРЕЗАПУСК…',failed:'НЕ УДАЛОСЬ ОБНОВИТЬ. ПОПРОБУЙТЕ ЕЩЁ РАЗ.',restart:'ПЕРЕЗАПУСТИТЬ ИГРУ',retry:'ПОВТОРИТЬ'}:{updating:'UPDATING…',ready:'UPDATE READY',applying:'RESTARTING…',failed:'COULD NOT UPDATE. PLEASE TRY AGAIN.',restart:'RESTART GAME',retry:'TRY AGAIN'};
document.documentElement.lang=ru?'ru':'en';
const status=document.getElementById('status'),bar=document.getElementById('progress'),button=document.getElementById('restart');
let failed=false;
const updater=new OfflineUpdater({onState:s=>{
 const busy=['checking','downloading','applying'].includes(s.status);
 status.textContent=['ready','blocked','done'].includes(s.status)?words.ready:s.status==='applying'?words.applying:words.updating;
 bar.hidden=!busy;button.disabled=busy;button.hidden=busy||s.status==='done';button.textContent=words.restart;
 if(s.status==='downloading'&&s.total){bar.max=s.total;bar.value=s.loaded;}else bar.removeAttribute('value');
 if(s.status==='done')location.replace('./index.html?updated='+encodeURIComponent(s.version.slice(0,12)));
}});
const showFailure=()=>{failed=true;status.textContent=words.failed;bar.hidden=true;button.hidden=false;button.disabled=false;button.textContent=words.retry;};
const prepare=()=>{failed=false;button.hidden=true;updater.start({automatic}).catch(showFailure);};
button.addEventListener('click',()=>failed?prepare():updater.apply({restart:true}).catch(showFailure));
prepare();
</script></body></html>
