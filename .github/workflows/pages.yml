name: Validate and publish Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Frontend behavior
        run: node --test tests/*.test.mjs
      - name: Original descriptive tutorial
        run: node tools/test_modern_tutorial.mjs
      - name: Public native source integrity
        run: |
          python3 tools/bootstrap_core_source.py --check
          python3 tools/test_bootstrap_core_source.py
      - name: Publication guards
        run: |
          python3 tools/build_runtime_atlas.py --check
          python3 tools/build_startup.py --check
          python3 tools/test_runtime_atlas.py
          python3 tools/test_publication.py
      - name: Build static site
        run: python3 tools/build_publication.py --output _site --revision "$GITHUB_SHA"
      - name: Verify complete package
        run: python3 tools/verify_publication.py _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  # A normal push validates and uploads a candidate. Publication remains an
  # explicit workflow_dispatch action after the playable candidate is accepted.
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
